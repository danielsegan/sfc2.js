name: Sim core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the skin layout check
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint sim packages
        run: pnpm lint:sim
      - name: Check the angle LUT
        run: pnpm lut:check
      - name: Unit tests
        run: pnpm test
