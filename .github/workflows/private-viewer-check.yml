# Headless check that every shiplist row loads and spins.
#
# workflow_dispatch only. Runs on the sfc2-ci runner, which can read
# /srv/sfc2/reference/2.670 (the Wine install, not the extracted tree).
# The log and the uploaded artifact are counts, pass/fail, error
# classes, skip reasons, and texture-miss classes. They do not include
# hull ids, texture names, or paths. The per-ship report (hull id and
# empire, still without texture names or paths) stays on the runner
# under $HOME/sfc2-private/viewer-check/<run-id>/. The job does not
# upload screenshots, textures, models, or the install.
# Chromium is installed into the runner user cache and is not uploaded.
name: Private ship viewer check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-viewer-check
  cancel-in-progress: false

env:
  SFC2_REFERENCE: /srv/sfc2/reference/2.670

jobs:
  viewer:
    name: Every shiplist ship in the viewer
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the checker on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/viewer-check/cli.ts ]]; then
            echo "tools/viewer-check/cli.ts is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the headless viewer
        run: pnpm exec playwright install chromium

      - name: Confirm the reference install is present
        run: |
          set +x
          set -euo pipefail
          if [[ -d "$SFC2_REFERENCE" ]]; then
            echo "present: reference"
          else
            echo "missing: reference"
            exit 1
          fi

      - name: Check every shiplist ship
        id: check
        continue-on-error: true
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/viewer-check/${GITHUB_RUN_ID}"
          mkdir -p "$dest" verify-output
          node --experimental-strip-types tools/viewer-check/cli.ts \
            --output "$dest/report.json" \
            --summary-out verify-output/viewer-summary.json

      - name: Guard the summary
        id: guard
        if: always() && steps.check.outcome != 'cancelled'
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/viewer-check/${GITHUB_RUN_ID}"
          test -s verify-output/viewer-summary.json
          test "$(stat -c %s verify-output/viewer-summary.json)" -lt 65536
          node --experimental-strip-types tools/viewer-check/cli.ts --check-summary verify-output/viewer-summary.json
          node --experimental-strip-types tools/viewer-check/cli.ts --summary "$dest/report.json" --allow-failures

      - name: Upload summary
        if: steps.guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-viewer-summary
          path: verify-output/viewer-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Require every ship to pass
        if: steps.guard.outcome == 'success'
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/viewer-check/${GITHUB_RUN_ID}"
          node --experimental-strip-types tools/viewer-check/cli.ts --summary "$dest/report.json"
