# Metadata-only BMP and install-index check against the CE 2.670 Wine tree.
#
# workflow_dispatch only. Runs on the sfc2-ci runner, which can read
# /srv/sfc2/reference/2.670/. It prints counts, bit depths, diagnostic
# codes and install-relative paths. It does not print file bytes, table
# rows or pixel samples, and it does not commit anything.
name: Private BMP install check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-bmp-install-check
  cancel-in-progress: false

env:
  SFC2_REFERENCE: /srv/sfc2/reference/2.670

jobs:
  verify:
    name: BMP pipeline against reference install
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the verifier on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/formats/verify-install.ts ]]; then
            echo "tools/formats/verify-install.ts is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the reference install is present
        run: |
          set -euo pipefail
          if [[ -d "$SFC2_REFERENCE" ]]; then
            echo "present: $SFC2_REFERENCE"
          else
            echo "missing: $SFC2_REFERENCE"
            exit 1
          fi

      - name: Verify BMP pipeline (metadata only)
        run: |
          set -euo pipefail
          mkdir -p verify-output
          node --experimental-strip-types tools/formats/verify-install.ts | tee verify-output/bmp-verify.json

      - name: Upload metadata report
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-bmp-verify
          path: verify-output/bmp-verify.json
          if-no-files-found: error
          retention-days: 7
