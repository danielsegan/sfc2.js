# Metadata-only BMP and install-index check against the CE 2.670 Wine tree.
#
# workflow_dispatch only. Runs on the sfc2-ci runner, which can read
# /srv/sfc2/reference/2.670/. The log and the uploaded artifact are
# counts, pass/fail, and diagnostic classes. The full report, including
# install-relative paths, stays on the runner under
# $HOME/sfc2-private/bmp-verify/<run-id>/. It does not print file bytes,
# table rows, or pixel samples, and it does not commit anything.
name: Private BMP install check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-bmp-install-check
  cancel-in-progress: false

env:
  SFC2_REFERENCE: /srv/sfc2/reference/2.670

jobs:
  verify:
    name: BMP pipeline against reference install
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the verifier on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/formats/verify-install.ts ]]; then
            echo "tools/formats/verify-install.ts is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the reference install is present
        run: |
          set +x
          set -euo pipefail
          if [[ -d "$SFC2_REFERENCE" ]]; then
            echo "present: reference"
          else
            echo "missing: reference"
            exit 1
          fi

      - name: Verify BMP pipeline (counts only)
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/bmp-verify/${GITHUB_RUN_ID}"
          mkdir -p "$dest" verify-output
          node --experimental-strip-types tools/formats/verify-install.ts \
            --output "$dest/bmp-verify.json" \
            --summary-out verify-output/bmp-summary.json

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-bmp-summary
          path: verify-output/bmp-summary.json
          if-no-files-found: error
          retention-days: 7
