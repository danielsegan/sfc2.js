# Private CE 2.670 inventory and shiplist/ftrlist verification.
#
# Runs only on the sfc2-ci self-hosted runner, which has read access to
# /srv/sfc2/reference/2.670/ and /srv/sfc2/extracted/2.670/.
# workflow_dispatch only — never on push, pull_request or schedule, so a
# fork or a public runner cannot start it.
#
# tools/inventory is on main. Dispatch against main, or against another
# ref that still contains tools/inventory/inventory.py. A ref without
# that file stops the inventory and verify jobs after checkout.
# The parse-shiplist-ftrlist job needs this repo's TypeScript parsers and
# Node 22. Its log is row counts and diagnostic classes. The full parser
# JSON stays on the runner.
#
# This workflow never commits (and never writes to main). The job log
# and the uploaded artifact are counts, pass/fail, and error classes.
# Paths, sizes, hashes, header names, and the generated JSON/MD stay on
# the runner under $HOME/sfc2-private/inventory/<run-id>/. See
# tools/inventory/README.md.
name: Private CE 2.670 inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ce-2670-inventory
  cancel-in-progress: false

env:
  SFC2_EXTRACTED: /srv/sfc2/extracted/2.670
  SFC2_REFERENCE: /srv/sfc2/reference/2.670
  SFC2_README: /srv/sfc2/README.md

jobs:
  inventory:
    name: Inventory extracted tree
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require inventory tools on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/inventory/inventory.py ]]; then
            echo "tools/inventory/inventory.py is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            echo "Dispatch with --ref formats/inventory-ce2670 (or another branch that has the tools)."
            echo "A dispatch against main is expected to stop here until that branch is merged."
            exit 1
          fi
          echo "tools present: tools/inventory/inventory.py"

      - name: Confirm private data is present
        run: |
          set +x
          set -euo pipefail
          present() {
            local label=$1 path=$2
            if [[ -e "$path" ]]; then
              echo "present: $label"
            else
              echo "missing: $label"
              exit 1
            fi
          }
          present extracted "$SFC2_EXTRACTED"
          present reference "$SFC2_REFERENCE"
          present readme "$SFC2_README"
          present manifest "$SFC2_EXTRACTED/manifest.json"

      - name: Run inventory (counts only on the log)
        run: |
          set +x
          set -euo pipefail
          python3 --version
          dest="${HOME}/sfc2-private/inventory/${GITHUB_RUN_ID}/inventory"
          mkdir -p "$dest" verify-output
          python3 tools/inventory/inventory.py inventory \
            --extracted "$SFC2_EXTRACTED" \
            --reference "$SFC2_REFERENCE" \
            --manifest "$SFC2_EXTRACTED/manifest.json" \
            --readme "$SFC2_README" \
            --output-dir "$dest" \
            --detail-log "$dest/detail.log" \
            --summary-out verify-output/inventory-summary.json

      - name: Upload inventory summary
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-inventory-summary
          path: verify-output/inventory-summary.json
          if-no-files-found: error
          retention-days: 7

  verify-shiplist-ftrlist:
    name: Verify shiplist and ftrlist
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require inventory tools on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/inventory/inventory.py ]]; then
            echo "tools/inventory/inventory.py is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            echo "Dispatch with --ref formats/inventory-ce2670 (or another branch that has the tools)."
            echo "A dispatch against main is expected to stop here until that branch is merged."
            exit 1
          fi
          echo "tools present: tools/inventory/inventory.py"

      - name: Confirm private data is present
        run: |
          set +x
          set -euo pipefail
          present() {
            local label=$1 path=$2
            if [[ -e "$path" ]]; then
              echo "present: $label"
            else
              echo "missing: $label"
              exit 1
            fi
          }
          present extracted "$SFC2_EXTRACTED"
          present reference "$SFC2_REFERENCE"
          present manifest "$SFC2_EXTRACTED/manifest.json"

      - name: Verify shiplist and ftrlist (counts only on the log)
        run: |
          set +x
          set -euo pipefail
          python3 --version
          dest="${HOME}/sfc2-private/inventory/${GITHUB_RUN_ID}/verify"
          mkdir -p "$dest" verify-output
          python3 tools/inventory/inventory.py verify \
            --extracted "$SFC2_EXTRACTED" \
            --reference "$SFC2_REFERENCE" \
            --manifest "$SFC2_EXTRACTED/manifest.json" \
            --output-dir "$dest" \
            --detail-log "$dest/detail.log" \
            --summary-out verify-output/verify-summary.json

      - name: Upload verification summary
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-shiplist-ftrlist-summary
          path: verify-output/verify-summary.json
          if-no-files-found: error
          retention-days: 7

  parse-shiplist-ftrlist:
    name: Parse shiplist and ftrlist (metadata only)
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the TypeScript parsers on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/formats/verify-ce-metadata.ts ]]; then
            echo "tools/formats/verify-ce-metadata.ts is not on this ref."
            exit 1
          fi
          command -v node
          node --version

      - name: Confirm private data is present
        run: |
          set +x
          set -euo pipefail
          if [[ -d "$SFC2_EXTRACTED" ]]; then
            echo "present: extracted"
          else
            echo "missing: extracted"
            exit 1
          fi

      - name: Parse spec tables and write counts only
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/inventory/${GITHUB_RUN_ID}/parser"
          mkdir -p "$dest" verify-output
          node --experimental-strip-types tools/formats/verify-ce-metadata.ts \
            --extracted "$SFC2_EXTRACTED" \
            --output "$dest/parser.json" \
            --summary-out verify-output/parser-summary.json

      - name: Upload parser summary
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-parser-summary
          path: verify-output/parser-summary.json
          if-no-files-found: error
          retention-days: 7
