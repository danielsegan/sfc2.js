# Private CE 2.670 inventory and shiplist/ftrlist verification.
#
# Runs only on the sfc2-ci self-hosted runner, which has read access to
# /srv/sfc2/reference/2.670/ and /srv/sfc2/extracted/2.670/.
# workflow_dispatch only — never on push, pull_request or schedule, so a
# fork or a public runner cannot start it.
#
# Dispatch this workflow with --ref formats/inventory-ce2670 (or another
# branch that contains tools/inventory). A dispatch against main stops
# the inventory jobs cleanly after checkout if those tools are not present.
# The parse-shiplist-ftrlist job needs this repo's TypeScript parsers and
# Node 22. It writes counts, header names, and hashes only.
#
# This workflow never commits (and never writes to main). It prints a
# metadata-only summary to the job log (paths, sizes, hashes, counts,
# header names) and uploads JSON/MD artifacts. It must not echo game
# file contents or table data rows. See tools/inventory/README.md on
# the inventory branch for how to copy artifacts onto that branch
# after review.
name: Private CE 2.670 inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ce-2670-inventory
  cancel-in-progress: false

env:
  SFC2_EXTRACTED: /srv/sfc2/extracted/2.670
  SFC2_REFERENCE: /srv/sfc2/reference/2.670
  SFC2_README: /srv/sfc2/README.md

jobs:
  inventory:
    name: Inventory extracted tree
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require inventory tools on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/inventory/inventory.py ]]; then
            echo "tools/inventory/inventory.py is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            echo "Dispatch with --ref formats/inventory-ce2670 (or another branch that has the tools)."
            echo "A dispatch against main is expected to stop here until that branch is merged."
            exit 1
          fi
          echo "tools present: tools/inventory/inventory.py"

      - name: Confirm private data is present (paths only)
        run: |
          set -euo pipefail
          for p in "$SFC2_EXTRACTED" "$SFC2_REFERENCE" "$SFC2_README" "$SFC2_EXTRACTED/manifest.json"; do
            if [[ -e "$p" ]]; then
              echo "present: $p"
            else
              echo "missing: $p"
              exit 1
            fi
          done

      - name: Run inventory (metadata only; do not print outputs or source files)
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/inventory/inventory.py inventory \
            --extracted "$SFC2_EXTRACTED" \
            --reference "$SFC2_REFERENCE" \
            --manifest "$SFC2_EXTRACTED/manifest.json" \
            --readme "$SFC2_README" \
            --output-dir docs/formats/inventory

      - name: Upload inventory metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-inventory-metadata
          path: |
            docs/formats/inventory/ce-2.670.json
            docs/formats/inventory/ce-2.670.md
            docs/formats/inventory/missions-ce-2.670.md
            docs/formats/inventory/observations-ce-2.670.json
          if-no-files-found: error
          retention-days: 7

  verify-shiplist-ftrlist:
    name: Verify shiplist and ftrlist
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require inventory tools on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/inventory/inventory.py ]]; then
            echo "tools/inventory/inventory.py is not on this ref ($(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD))."
            echo "Dispatch with --ref formats/inventory-ce2670 (or another branch that has the tools)."
            echo "A dispatch against main is expected to stop here until that branch is merged."
            exit 1
          fi
          echo "tools present: tools/inventory/inventory.py"

      - name: Confirm private data is present (paths only)
        run: |
          set -euo pipefail
          for p in "$SFC2_EXTRACTED" "$SFC2_REFERENCE" "$SFC2_EXTRACTED/manifest.json"; do
            if [[ -e "$p" ]]; then
              echo "present: $p"
            else
              echo "missing: $p"
              exit 1
            fi
          done

      - name: Verify shiplist and ftrlist (metadata only; do not print outputs or source files)
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/inventory/inventory.py verify \
            --extracted "$SFC2_EXTRACTED" \
            --reference "$SFC2_REFERENCE" \
            --manifest "$SFC2_EXTRACTED/manifest.json" \
            --output-dir docs/formats/inventory

      - name: Upload verification metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-shiplist-ftrlist-metadata
          path: |
            docs/formats/inventory/shiplist-ftrlist-ce-2.670.json
            docs/formats/inventory/shiplist-ftrlist-ce-2.670.md
          if-no-files-found: error
          retention-days: 7

  parse-shiplist-ftrlist:
    name: Parse shiplist and ftrlist (metadata only)
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require the TypeScript parsers on this ref
        run: |
          set -euo pipefail
          if [[ ! -f tools/formats/verify-ce-metadata.ts ]]; then
            echo "tools/formats/verify-ce-metadata.ts is not on this ref."
            exit 1
          fi
          command -v node
          node --version

      - name: Confirm private data is present (paths only)
        run: |
          set -euo pipefail
          if [[ -d "$SFC2_EXTRACTED" ]]; then
            echo "present: $SFC2_EXTRACTED"
          else
            echo "missing: $SFC2_EXTRACTED"
            exit 1
          fi

      - name: Parse spec tables and write counts only
        run: |
          set -euo pipefail
          mkdir -p docs/formats/inventory
          node --experimental-strip-types tools/formats/verify-ce-metadata.ts \
            --extracted "$SFC2_EXTRACTED" \
            --output docs/formats/inventory/parser-ce-2.670.json

      - name: Upload parser metadata
        uses: actions/upload-artifact@v4
        with:
          name: ce-2.670-parser-metadata
          path: docs/formats/inventory/parser-ce-2.670.json
          if-no-files-found: error
          retention-days: 7
