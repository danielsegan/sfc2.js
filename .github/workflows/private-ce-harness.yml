# Private CE 2.670 behaviour capture (clean-room observation harness).
#
# Runs the original game under Wine + Xvfb on the sfc2-ci self-hosted runner,
# drives a repeatable skirmish with xdotool, and measures on-screen behaviour
# (own-ship turn timing by speed, HUD energy panel numbers) from screenshots.
# See tools/ce-harness/README.md.
#
# workflow_dispatch only: never on push, pull_request or schedule.
# The log and the uploaded artifact are run counts, pass/fail, and
# noop classes. Per-run turn rates, speeds, and energy readings stay on
# the runner under $HOME/sfc2-private/ce-harness/<run-id>/. Screenshots,
# frames, the Wine prefix, and the game working copy are deleted.
name: Private CE harness capture

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Own ship: fed (F-CA) or klingon (K-D7); opponent is one LOW-BPV Klingon frigate"
        type: choice
        options: [fed, klingon]
        default: fed
      speeds:
        description: "Space-separated target speeds for the port-turn runs"
        type: string
        default: "5 10 15 20"

permissions:
  contents: read

concurrency:
  group: private-ce-harness
  cancel-in-progress: false

env:
  SFC2_REFERENCE: /srv/sfc2/reference/2.670

jobs:
  capture:
    name: Capture ${{ inputs.scenario }} turns
    runs-on: [self-hosted, sfc2-ci, private-data]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set -euo pipefail
          [[ "$SPEEDS" =~ ^[0-9]+([[:space:]][0-9]+)*$ ]] || { echo "speeds must be integers separated by spaces"; exit 1; }

      - name: Build harness image (no game data in the image)
        run: docker build -t sfc2-ce-harness:ci tools/ce-harness/docker

      - name: Prepare private working copy (runner-local)
        run: tools/ce-harness/prepare_workcopy.sh "$SFC2_REFERENCE" "$RUNNER_TEMP/ce-game"

      - name: Run scenario (observation only)
        env:
          CE_GAME_DIR: ${{ runner.temp }}/ce-game
          CE_OUT_DIR: ${{ runner.temp }}/ce-out
          CE_PREFIX: ${{ runner.temp }}/ce-prefix
          CE_IMAGE: sfc2-ce-harness:ci
          CE_CONTAINER: ce-harness-${{ github.run_id }}
          SCENARIO: ${{ inputs.scenario }}
          SPEEDS: ${{ inputs.speeds }}
        run: |
          set +x
          set -euo pipefail
          export CE_DOCKER_USER="$(id -u):$(id -g)"
          dest="${HOME}/sfc2-private/ce-harness/${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          # shellcheck disable=SC2086
          if ! tools/ce-harness/run_scenario.sh "$SCENARIO" "$SCENARIO" $SPEEDS >"$dest/scenario.log" 2>&1; then
            echo "scenario result=fail class=run-failed"
            exit 1
          fi
          echo "scenario result=pass"

      - name: Summarize counts
        run: |
          set +x
          set -euo pipefail
          dest="${HOME}/sfc2-private/ce-harness/${GITHUB_RUN_ID}"
          mkdir -p "$dest" verify-output
          python3 tools/ce-harness/summarize.py "$RUNNER_TEMP/ce-out/runs" "$dest/results" "${{ inputs.scenario }}-*"
          cp "$dest/results-summary.json" verify-output/ce-harness-summary.json

      - name: Guard summary contents
        run: |
          set +x
          set -euo pipefail
          python3 - << 'PY'
          import json, sys
          path = "verify-output/ce-harness-summary.json"
          data = json.load(open(path, encoding="utf-8"))
          allowed = {"result", "runs", "noop", "measured", "byKind", "byNoopReason"}
          extra = set(data) - allowed
          if extra or not isinstance(data.get("runs"), int):
              print("harness summary rejected class=shape")
              sys.exit(1)
          print(f"harness result={data['result']} runs={data['runs']} noop={data['noop']} measured={data['measured']}")
          PY

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: ce-harness-${{ inputs.scenario }}-${{ github.run_id }}-summary
          path: verify-output/ce-harness-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Clean up runner-local game copy, frames and prefix
        if: always()
        run: |
          set +x
          docker rm -f "ce-harness-${{ github.run_id }}" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/ce-game" "$RUNNER_TEMP/ce-out" "$RUNNER_TEMP/ce-prefix"
